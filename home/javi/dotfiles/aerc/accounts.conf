# Password is never stored here or in git. *-cred-cmd reads it from a file
# outside the Nix store/repo that you create by hand (hjem's .config/aerc is
# a read-only symlink, so it can't live inside this directory):
#
#   mkdir -p -m 700 ~/.secrets/aerc
#   printf '%s' 'the-password' > ~/.secrets/aerc/java-jvax.pass
#   chmod 600 ~/.secrets/aerc/java-jvax.pass

[java@jv.ax]
source = imaps://java%40jv.ax@email.jv.ax
source-cred-cmd = cat ~/.secrets/aerc/java-jvax.pass
outgoing = smtps://java%40jv.ax@email.jv.ax
outgoing-cred-cmd = cat ~/.secrets/aerc/java-jvax.pass
from = Javi <java@jv.ax>
copy-to = Sent
postpone = Drafts
