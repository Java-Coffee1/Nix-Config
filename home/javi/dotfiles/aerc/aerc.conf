[general]
# accounts.conf has no real secrets (passwords live in ~/.secrets/aerc/*.pass,
# read via cred-cmd) but its perms can't be tightened to 600: hjem symlinks
# .config/aerc read-only into the Nix store, which is always world-readable.
unsafe-accounts-conf = true

[ui]
sidebar-width = 22
index-format = "%D %-17.17n %Z %s"

[viewer]
pager = less -R
alternatives = text/plain,text/html

[compose]
# falls back to $EDITOR (nvim) if unset, kept explicit for clarity
editor = nvim
