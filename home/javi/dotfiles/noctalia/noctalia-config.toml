[accessibility]
ui_scale = 1.2500000111758709

[bar]
order = [ "taskbar" ]

    [bar.taskbar]
    background_opacity = 0.60999998636543751
    capsule_thickness = 0.5599999912083149
    center = [ "cat", "clock" ]
    end = [
        "media",
        "wallpaper",
        "clipboard",
        "network",
        "bluetooth",
        "brightness",
        "input_volume",
        "control-center",
        "battery"
    ]
    font_family = "JetBrainsMono Nerd Font Mono"
    font_scale = 0.74999999068677425
    margin_edge = 10
    margin_ends = 10
    radius = 19
    scale = 1.300000011920929
    start = [ "workspaces", "audio_visualizer" ]
    thickness = 44
    widget_spacing = 13

[battery]
warning_threshold = 15

[calendar]
enabled = true

    [calendar.account.78897378477]
