[osd]
background_opacity = 0.99999997764825821

    [osd.kinds]
    media = false

[plugins]
enabled = [ "dotnetrob/cat" ]

[shell]
font_family = "Noto Sans CJK KR"
panel_anchor_bar = "taskbar"

    [shell.launcher]
    pinned = [ "Firefox", "code", "discord" ]

    [shell.panel]
    control_center_placement = "floating"
    floating_layer = "top"
    floating_offset = 7
    launcher_placement = "attached"
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"

[theme]
builtin = "Ayu"
community_palette = "ADW"
custom_palette = "wallpaper2-mc"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "hyprland", "qt" ]
    community_ids = [ "hyprtoolkit" ]

[wallpaper]
directory = "/home/javi/Nix-Config/modules/desktop/wallpaper"
fill_mode = "stretch"

    [wallpaper.default]
    path = "/home/javi/Nix-Config/modules/desktop/wallpaper/wallpaper2.png"

    [wallpaper.last]
    path = "/home/javi/Nix-Config/modules/desktop/wallpaper/wallpaper2.png"

    [wallpaper.monitors.DP-10]
    path = "/home/javi/Nix-Config/modules/desktop/wallpaper/wallpaper1.png"

    [wallpaper.monitors.DP-11]
    path = "/home/javi/Nix-Config/modules/desktop/wallpaper/wallpaper2.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/javi/Nix-Config/modules/desktop/wallpaper/wallpaper2.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/javi/Nix-Config/modules/desktop/wallpaper/wallpaper2.png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[widget.audio_visualizer]
bands = 28
show_when_idle = true
width = 276

[widget.cat]
font_scale = 1.1699999999999999
scale = 2.2000000000000002
type = "dotnetrob/cat:cat"

[widget.control-center]
glyph = "adjustments"
